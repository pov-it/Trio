<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FoodFinder Agent Lab</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f3f4f7;
      --panel: #ffffff;
      --text: #111318;
      --muted: #71727a;
      --line: #d7d8df;
      --blue: #2097ee;
      --green: #35c46d;
      --yellow: #f2b84b;
      --red: #ff4d5e;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1522;
        --panel: #172235;
        --text: #f5f7fb;
        --muted: #a6adbb;
        --line: #2b3850;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing: 0; }
    h2 { font-size: 18px; }
    h3 { font-size: 15px; }
    p { color: var(--muted); line-height: 1.45; }

    .grid {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 16px;
      align-items: start;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel), var(--bg) 40%);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.35;
    }

    button {
      border: 0;
      border-radius: 999px;
      background: var(--blue);
      color: white;
      font: inherit;
      font-weight: 700;
      padding: 12px 18px;
      cursor: pointer;
    }

    button.secondary {
      background: color-mix(in srgb, var(--blue), transparent 84%);
      color: var(--blue);
    }

    button:disabled {
      opacity: 0.55;
      cursor: wait;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .row > * { flex: 1; }
    .row > button { flex: 0 auto; }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      background: color-mix(in srgb, var(--muted), transparent 86%);
      color: var(--muted);
    }

    .pill.openFoodFacts { background: color-mix(in srgb, var(--green), transparent 84%); color: #118040; }
    .pill.usda { background: color-mix(in srgb, var(--blue), transparent 84%); color: var(--blue); }
    .pill.aiEstimate { background: color-mix(in srgb, var(--yellow), transparent 80%); color: #9a6500; }

    .stack {
      display: grid;
      gap: 12px;
    }

    .ingredient {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      background: color-mix(in srgb, var(--panel), var(--bg) 28%);
    }

    .ingredient-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .macros {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .macro {
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel), var(--bg) 55%);
      padding: 8px;
      text-align: center;
    }

    .macro strong { display: block; font-size: 17px; }
    .macro span { color: var(--muted); font-size: 11px; }

    pre {
      margin: 0;
      padding: 12px;
      overflow: auto;
      border-radius: 12px;
      background: #101725;
      color: #e8eefb;
      max-height: 360px;
      font-size: 12px;
      line-height: 1.45;
    }

    .log {
      display: grid;
      gap: 8px;
    }

    .log-item {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      background: color-mix(in srgb, var(--panel), var(--bg) 45%);
      color: var(--muted);
      font-size: 12px;
    }

    .ok { color: var(--green); font-weight: 700; }
    .failed { color: var(--red); font-weight: 700; }
    .started { color: var(--blue); font-weight: 700; }

    .photos {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .photos img {
      width: 68px;
      height: 68px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid var(--line);
    }

    @media (max-width: 860px) {
      main { padding: 14px; }
      .grid { grid-template-columns: 1fr; }
      .macros { grid-template-columns: repeat(2, 1fr); }
      .log-item { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>FoodFinder Agent Lab</h1>
        <p>Local test surface for AI ingredient parsing, food database tools, and verified macro output.</p>
      </div>
      <span class="pill">max 6 photos</span>
    </header>

    <div class="grid">
      <section class="panel">
        <div class="row">
          <label>Provider
            <select id="provider">
              <option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option>
            </select>
          </label>
          <label>Model
            <input id="model" value="gpt-4o-mini">
          </label>
        </div>

        <label>AI API key
          <input id="apiKey" type="password" autocomplete="off" placeholder="Used by the local proxy for this request">
        </label>

        <label>USDA API key (optional)
          <input id="usdaKey" type="password" autocomplete="off" placeholder="Enables USDA FoodData Central lookups">
        </label>

        <label>Response language
          <input id="language" value="nl">
        </label>

        <label>Meal text
          <textarea id="mealText" placeholder="Bijvoorbeeld: spaghetti gamberi e zucchine, grote portie"></textarea>
        </label>

        <label>Photos
          <input id="photos" type="file" accept="image/*" multiple>
        </label>
        <div id="photoPreview" class="photos"></div>

        <label class="row" style="grid-template-columns:auto 1fr; display:flex;">
          <input id="useAI" type="checkbox" checked style="width:auto;">
          Use AI for intent parsing and final composition
        </label>

        <div class="toolbar">
          <button id="runButton">Run agent</button>
          <button class="secondary" id="clearButton" type="button">Clear result</button>
        </div>
        <p class="hint">Keys are stored in this browser's localStorage for local testing convenience.</p>
      </section>

      <section class="stack">
        <div class="panel">
          <h2>Verified Ingredients</h2>
          <div id="ingredients" class="stack" style="margin-top:12px;"></div>
        </div>

        <div class="panel">
          <h2>Tool Calls</h2>
          <div id="toolLog" class="log" style="margin-top:12px;"></div>
        </div>

        <div class="panel">
          <h2>Final JSON</h2>
          <pre id="jsonOutput">{}</pre>
        </div>
      </section>
    </div>
  </main>

  <script>
    const ids = ["provider", "model", "apiKey", "usdaKey", "language", "mealText", "useAI"];
    const state = { images: [] };

    for (const id of ids) {
      const el = document.getElementById(id);
      const saved = localStorage.getItem(`fflab.${id}`);
      if (saved !== null) {
        if (el.type === "checkbox") el.checked = saved === "true";
        else el.value = saved;
      }
      el.addEventListener("input", () => {
        localStorage.setItem(`fflab.${id}`, el.type === "checkbox" ? el.checked : el.value);
        if (id === "provider") {
          document.getElementById("model").value = el.value === "gemini" ? "gemini-1.5-flash" : "gpt-4o-mini";
        }
      });
    }

    document.getElementById("photos").addEventListener("change", async event => {
      const files = Array.from(event.target.files || []).slice(0, 6);
      state.images = await Promise.all(files.map(fileToDataURL));
      renderPhotos();
    });

    document.getElementById("runButton").addEventListener("click", runAgent);
    document.getElementById("clearButton").addEventListener("click", () => {
      renderResult({ enriched: [], toolLog: [], final: {} });
    });

    async function runAgent() {
      const button = document.getElementById("runButton");
      button.disabled = true;
      button.textContent = "Running...";
      try {
        const payload = {
          provider: value("provider"),
          model: value("model"),
          apiKey: value("apiKey"),
          usdaKey: value("usdaKey"),
          language: value("language"),
          mealText: value("mealText"),
          useAI: document.getElementById("useAI").checked,
          images: state.images
        };
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify(payload)
        });
        const json = await response.json();
        if (!response.ok) throw new Error(json.error || "Request failed");
        renderResult(json);
      } catch (error) {
        renderResult({
          enriched: [],
          toolLog: [{ type: "local", name: "request", status: "failed", error: error.message }],
          final: { error: error.message }
        });
      } finally {
        button.disabled = false;
        button.textContent = "Run agent";
      }
    }

    function renderResult(result) {
      document.getElementById("jsonOutput").textContent = JSON.stringify(result.final || {}, null, 2);
      renderTools(result.toolLog || []);
      renderIngredients(result.enriched || []);
    }

    function renderIngredients(items) {
      const root = document.getElementById("ingredients");
      root.innerHTML = "";
      if (!items.length) {
        root.innerHTML = "<p>No ingredients yet.</p>";
        return;
      }
      for (const item of items) {
        const selected = item.selected || { sourceID: "aiEstimate", name: "AI estimate", verifiedScore: 0.35 };
        const card = document.createElement("article");
        card.className = "ingredient";
        card.innerHTML = `
          <div class="ingredient-head">
            <div>
              <h3>${escapeHTML(item.name)}</h3>
              <p>${escapeHTML(item.portion || "No portion hint")}</p>
            </div>
            <span class="pill ${selected.sourceID}">${sourceTitle(selected.sourceID)} ${Math.round((selected.matchScore || selected.verifiedScore || 0) * 100)}%</span>
          </div>
          <p>${escapeHTML(selected.name || "No source match")} ${selected.brand ? " - " + escapeHTML(selected.brand) : ""}</p>
          <div class="macros">
            ${macro("Carbs", selected.carbs, "g")}
            ${macro("Fat", selected.fat, "g")}
            ${macro("Protein", selected.protein, "g")}
            ${macro("Fiber", selected.fiber, "g")}
            ${macro("Kcal", selected.calories, "")}
          </div>
        `;
        root.appendChild(card);
      }
    }

    function renderTools(log) {
      const root = document.getElementById("toolLog");
      root.innerHTML = "";
      if (!log.length) {
        root.innerHTML = "<p>No tool calls yet.</p>";
        return;
      }
      for (const entry of log) {
        const row = document.createElement("div");
        row.className = "log-item";
        row.innerHTML = `
          <span class="${entry.status}">${escapeHTML(entry.status || "")}</span>
          <span>${escapeHTML(entry.name || "")}${entry.query ? " - " + escapeHTML(entry.query) : ""}${entry.error ? " - " + escapeHTML(entry.error) : ""}</span>
          <span>${entry.count !== undefined ? entry.count + " hits" : ""}${entry.ms ? " / " + entry.ms + " ms" : ""}</span>
        `;
        root.appendChild(row);
      }
    }

    function renderPhotos() {
      const root = document.getElementById("photoPreview");
      root.innerHTML = "";
      for (const data of state.images) {
        const img = document.createElement("img");
        img.src = data;
        root.appendChild(img);
      }
    }

    function macro(label, value, unit) {
      const number = Number(value || 0).toFixed(label === "Kcal" ? 0 : 1);
      return `<div class="macro"><strong>${number}${unit}</strong><span>${label}</span></div>`;
    }

    function sourceTitle(source) {
      if (source === "openFoodFacts") return "OFF";
      if (source === "usda") return "USDA";
      return "AI";
    }

    function value(id) {
      return document.getElementById(id).value.trim();
    }

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#039;"
      })[char]);
    }
  </script>
</body>
</html>
